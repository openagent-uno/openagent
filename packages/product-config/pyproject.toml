[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-product-config"
version = "1.0.0b1"
description = "Standalone OpenAgent product product-config"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core==1.0.0b1", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_product_config*"]

[tool.setuptools.package-data]
openagent_product_config = ["**/*.json", "**/*.sql", "**/*.yaml"]
