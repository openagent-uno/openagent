[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-client-transport"
version = "1.1.0b4"
description = "Standalone OpenAgent client identity adapters and stream framing"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core==1.1.0b1", "openagent-identity==1.1.0b4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_client_transport*"]
