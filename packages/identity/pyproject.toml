[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-identity"
version = "1.1.0b1"
description = "Standalone OpenAgent product identity"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core==1.1.0b1", "iroh==0.35.0", "aiohttp>=3.9", "cbor2>=5.5", "cryptography>=42,<49", "srptools>=1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_identity*"]

[tool.setuptools.package-data]
openagent_identity = ["**/*.json", "**/*.sql", "**/*.yaml"]
