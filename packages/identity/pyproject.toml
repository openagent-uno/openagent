[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-identity"
version = "1.1.0b65"
description = "Standalone OpenAgent product identity"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core==1.1.0b32", "iroh==0.35.0", "aiohttp>=3.14.4", "cbor2>=5.5",
    # Same platform split as the framework: 50.x where a wheel exists, the last
    # universal2 wheel on Intel macOS, the last native wheel on Windows ARM64.
    "cryptography>=50.0.2; (platform_system != 'Windows' or platform_machine != 'ARM64') and (platform_system != 'Darwin' or platform_machine != 'x86_64')",
    "cryptography==48.0.1; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "cryptography==46.0.3; platform_system == 'Windows' and platform_machine == 'ARM64'",
    "srptools>=1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_identity*"]

[tool.setuptools.package-data]
openagent_identity = ["**/*.json", "**/*.sql", "**/*.yaml"]
