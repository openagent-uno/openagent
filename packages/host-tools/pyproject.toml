[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-host-tools"
dynamic = ["version"]
description = "Local capability host shared by OpenAgent desktop and CLI clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OpenAgent contributors" }]
dependencies = [
    "openagent-capability-host==1.0.0b2",
    "openagent-tool-protocol==1.0.0b2",
    "openagent-filesystem==1.0.0b3",
    "openagent-editor==1.0.0b3",
    "openagent-shell==1.0.0b3",
    "openagent-device-tools==1.0.0b7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
openagent-host-tools = "openagent_host_tools.stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_host_tools"]

[tool.hatch.version]
path = "src/openagent_host_tools/_version.py"

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "openagent_host_tools/THIRD_PARTY_NOTICES.md"
"src/openagent_host_tools/builtins-lock.json" = "openagent_host_tools/builtins-lock.json"
"src/openagent_host_tools/sidecar-manifests.json" = "openagent_host_tools/sidecar-manifests.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/openagent_host_tools",
    "sidecars",
    "scripts",
    "openagent-host-tools.spec",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSE",
]
exclude = [
    "**/node_modules/**",
    "**/target/**",
    "**/bin/**",
    "dist/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Independently released Core/Tools artifacts; no source overlays.
[tool.uv]
constraint-dependencies = [
    "openagent-capability-host @ https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.39/openagent_capability_host-1.0.0b2-py3-none-any.whl?download=1#sha256=5d9f78bf006a8b22b8476448d44ce18ca226d3adc13108991709042b971c4ffe",
    "openagent-connectors @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.5/openagent_connectors-0.1.15-py3-none-any.whl?download=1#sha256=a67a7a963cc63fcfdd7c80cddc8783773eebdcffdb0fd2354d8064f84e475cb6",
