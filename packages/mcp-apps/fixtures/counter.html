<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px system-ui;margin:16px;color:#14302c;background:#f4fbf8}button{padding:8px 14px;margin:6px;border-radius:8px;border:1px solid #539481;background:#fff}output{font-size:24px;font-weight:600}#status{font-size:12px}</style></head><body><h2>Shared MCP App fixture</h2><output id="count">0</output><p><button disabled id="increment">Increment</button><button disabled id="message">Suggest message</button><button disabled id="context">Update context</button></p><p id="status">Initializing</p><script>
let next=1,ready=false;const calls=new Map();
function request(method,params){const id=next++;return new Promise((resolve,reject)=>{calls.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const f=event.data;if(!f||f.jsonrpc!=='2.0')return;if(f.id!==undefined&&calls.has(f.id)){const c=calls.get(f.id);calls.delete(f.id);f.error?c.reject(new Error(f.error.message)):c.resolve(f.result);return}if(f.method==='ui/notifications/tool-result'){document.getElementById('count').textContent=String(f.params.structuredContent?.count??0);document.getElementById('status').textContent='Result received'}else if(f.method==='ui/notifications/tool-cancelled')document.getElementById('status').textContent='Cancelled';else if(f.method==='ui/resource-teardown')window.parent.postMessage({jsonrpc:'2.0',id:f.id,result:{}},'*')});
document.getElementById('increment').onclick=async()=>{try{const r=await request('tools/call',{name:'increment',arguments:{by:1}});document.getElementById('count').textContent=String(r.structuredContent.count)}catch(e){document.getElementById('status').textContent=e.message}};
document.getElementById('message').onclick=async()=>{await request('ui/message',{role:'user',content:[{type:'text',text:'Use this displayed result'}]});document.getElementById('status').textContent='Message requested'};
document.getElementById('context').onclick=async()=>{await request('ui/update-model-context',{structuredContent:{selection:'counter'}});document.getElementById('status').textContent='Context updated'};
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'counter-fixture',version:'1'},appCapabilities:{}}).then(()=>{notify('ui/notifications/initialized',{});notify('ui/notifications/size-changed',{height:240});ready=true;document.querySelectorAll('button').forEach(button=>button.disabled=false);document.getElementById('status').textContent='Ready'}).catch(e=>document.getElementById('status').textContent=e.message);
</script></body></html>
