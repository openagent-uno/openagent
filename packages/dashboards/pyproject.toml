[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-dashboards"
version = "1.1.0b6"
description = "Standalone OpenAgent product dashboards"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core==1.1.0b2", "openagent-identity==1.1.0b6", "aiohttp>=3.9", "jsonschema>=4.20.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_dashboards*"]

[tool.setuptools.package-data]
openagent_dashboards = ["**/*.json", "**/*.sql", "**/*.yaml"]
