[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-support-integration"
version = "1.1.3.dev2026103005"
description = "Optional host-configured support integration boundary"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core[engine]==1.1.0b38.dev2026103005"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_support*"]

[tool.setuptools.package-data]
openagent_support = ["**/*.json", "**/*.sql", "**/*.yaml"]
