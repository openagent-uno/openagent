# Root product tests (tests/). Run them with the server environment:
#   cd apps/server && uv sync --frozen --all-extras
#   uv pip install --python .venv pytest pytest-asyncio
#   uv pip install --python .venv -e ../cli    # only for tests/test_cli_connector_shop.py
#   cd ../.. && apps/server/.venv/bin/python -m pytest tests
#
# The suite's async fixtures are plain @pytest.fixture coroutines, which
# pytest-asyncio only drives in auto mode; in its default strict mode every
# test that uses one errors at setup ("requested an async fixture ... with no
# plugin or hook that handled it").
[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
