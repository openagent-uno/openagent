openagent-channel-bridges = { path = "../../packages/channel-bridges" }
openagent-client-transport = { path = "../../packages/client-transport" }
openagent-dashboards = { path = "../../packages/dashboards" }
openagent-identity = { path = "../../packages/identity" }
openagent-mcp = { path = "../mcp-bridge" }
openagent-support-integration = { path = "../../packages/integrations/support" }
openagent-product-config = { path = "../../packages/product-config" }

openagent-core = { url = "https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.39/openagent_core-1.1.0b39-py3-none-any.whl?download=1" }
openagent-storage-sqlite = { url = "https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.39/openagent_storage_sqlite-1.1.0b39-py3-none-any.whl?download=1" }
openagent-capability-host = { url = "https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.39/openagent_capability_host-1.0.0b2-py3-none-any.whl?download=1" }

