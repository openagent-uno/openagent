# Same-product composition with independently released SDK artifacts.
[tool.uv.sources]
openagent-channel-bridges = { url = "https://github.com/openagent-uno/openagent/releases/download/channel-bridges-v0.1.0-beta.35/openagent_channel_bridges-0.1.0b35-py3-none-any.whl?download=1" }
openagent-client-transport = { path = "../../packages/client-transport" }
openagent-dashboards = { path = "../../packages/dashboards" }
openagent-identity = { path = "../../packages/identity" }
openagent-mcp = { path = "../mcp-bridge" }
openagent-support-integration = { path = "../../packages/integrations/support" }
openagent-product-config = { path = "../../packages/product-config" }

openagent-core = { url = "https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.175/openagent_core-1.1.0b175-py3-none-any.whl?download=1" }
openagent-storage-sqlite = { url = "https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.175/openagent_storage_sqlite-1.1.0b175-py3-none-any.whl?download=1" }
