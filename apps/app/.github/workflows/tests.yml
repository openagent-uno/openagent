name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'beta/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            universal/package-lock.json
            desktop/package-lock.json
      - name: Install universal dependencies
        working-directory: universal
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Run app test gate
        run: bash test.sh
