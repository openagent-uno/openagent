[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-cli"
version = "1.1.0b49"
description = "CLI client for OpenAgent — connects to any OpenAgent Gateway"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "openagent-client-transport==1.1.0b39",
    "aiohttp>=3.9",
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.48,<4",
    "openagent-host-tools==1.0.0b6",
    # The standalone ``openagent_cli.network`` package implements the
    # client side of Iroh/certificate transport; ``openagent_client_transport``
    # carries the checksum-locked stream/capability protocol shared with the
    # server. Keep dependencies explicit so the wheel remains standalone.
    "iroh==0.35.0",
    "cbor2>=5.6",
    "srptools>=1.0",
    # 46.0.3 is the newest cryptography release with a Windows ARM64 wheel.
    # Pin that platform to the published ABI3 artifact instead of attempting an
    # OpenSSL source build on every user/release install. Other platforms remain
    # on the normal rolling lower bound.
    "cryptography>=42; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "cryptography==46.0.3; platform_system == 'Windows' and platform_machine == 'ARM64'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_cli*"]
namespaces = false

[project.scripts]
openagent-cli = "openagent_cli.main:main"

# Public release wheels for source UV resolution; preserve declared versions and extras.
[tool.uv]
constraint-dependencies = [
    "openagent-capability-host @ https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.22/openagent_capability_host-1.0.0b1-py3-none-any.whl#sha256=227d2a50962241d69c8d816efc60621ca2c8062351a9d8609d2d9b951d7c1342",
    "openagent-client-transport @ https://github.com/openagent-uno/openagent/releases/download/v1.1.0-beta.43/openagent_client_transport-1.1.0b39-py3-none-any.whl#sha256=56b9f0623b85631b07db80a53d51aa302f356452d9a7fdb5f61b2b2b9e390b19",
    "openagent-core @ https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.22/openagent_core-1.1.0b22-py3-none-any.whl#sha256=c8390c53ee269cfb1448304c1827894d915cbdaf801cbfbefa0885419c1c9d97",
    "openagent-device-tools @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.4/openagent_device_tools-1.0.0b4-py3-none-any.whl#sha256=6557b9a3dae398eee5374283b09d626b834177f3e377e890e54e16304caf74aa",
    "openagent-editor @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.4/openagent_editor-1.0.0b2-py3-none-any.whl#sha256=c38ede7fa9a76515cfd4dec42efff30d688942ead589ed6b49c50a8816feb93c",
    "openagent-filesystem @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.4/openagent_filesystem-1.0.0b2-py3-none-any.whl#sha256=76d7becc81d90455c0aba46b71b1182a47d6c6bccaa41fee2965b6d530b6da3c",
    "openagent-host-tools @ https://github.com/openagent-uno/openagent/releases/download/v1.1.0-beta.43/openagent_host_tools-1.0.0b6-py3-none-any.whl#sha256=b7e127a036d0a18c1fce2f38dae5f405e68b80eb8d4ed16fd6e0758f6b272a5e",
    "openagent-identity @ https://github.com/openagent-uno/openagent/releases/download/v1.1.0-beta.43/openagent_identity-1.1.0b39-py3-none-any.whl#sha256=19359d32d8ecc6ea57dc7a737890b445c214f48a3fd0794c6bf267edc1a1e59b",
    "openagent-shell @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.4/openagent_shell-1.0.0b2-py3-none-any.whl#sha256=3d68ece425467478cff0855ee20054fffe52efad9be0ca25431ba6b2694518a8",
    "openagent-tool-protocol @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.4/openagent_tool_protocol-1.0.0b1-py3-none-any.whl#sha256=3d4c266eb8e51552408c70448ad7c466a6cb8fa7263939412ce4069c8b73cef2",
