[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-cli"
version = "1.1.3.dev2026103007"
description = "CLI client for OpenAgent — connects to any OpenAgent Gateway"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "openagent-client-transport==1.1.3.dev2026103005",
    # The CLI network compatibility modules import this package directly.
    "openagent-identity==1.1.3.dev2026103005",
    "aiohttp>=3.9",
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.48,<4",
    "openagent-host-tools==1.0.0b7.dev2026103004",
    # The standalone ``openagent_cli.network`` package implements the
    # client side of Iroh/certificate transport; ``openagent_client_transport``
    # carries the checksum-locked stream/capability protocol shared with the
    # server. Keep dependencies explicit so the wheel remains standalone.
    "iroh==0.35.0",
    "cbor2>=5.6",
    "srptools>=1.0",
    # 46.0.3 is the newest cryptography release with a Windows ARM64 wheel.
    # Pin that platform to the published ABI3 artifact instead of attempting an
    # OpenSSL source build on every user/release install. Other platforms remain
    # on the normal rolling lower bound.
    "cryptography>=42; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "cryptography==46.0.3; platform_system == 'Windows' and platform_machine == 'ARM64'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_cli*"]
namespaces = false

[project.scripts]
openagent-cli = "openagent_cli.main:main"

# Unpublished source candidate: SDK wheels share the server's verified artifact directory.
# Published release locks remain unchanged; qualification verifies the candidate manifest.
[tool.uv]
constraint-dependencies = []

[tool.uv.sources]
openagent-client-transport = { path = "../../packages/client-transport" }
openagent-identity = { path = "../../packages/identity" }

openagent-core = { path = "../server/vendor/runtime-candidate/openagent_core-1.1.0b38.dev2026103005-py3-none-any.whl" }
openagent-storage-sqlite = { path = "../server/vendor/runtime-candidate/openagent_storage_sqlite-1.1.0b38.dev2026103005-py3-none-any.whl" }
openagent-capability-host = { path = "../server/vendor/runtime-candidate/openagent_capability_host-1.0.0b2.dev2026103002-py3-none-any.whl" }
openagent-tool-protocol = { path = "../server/vendor/runtime-candidate/openagent_tool_protocol-1.0.0b2.dev2026103002-py3-none-any.whl" }
openagent-host-tools = { path = "../server/vendor/runtime-candidate/openagent_host_tools-1.0.0b7.dev2026103004-py3-none-any.whl" }
openagent-device-tools = { path = "../server/vendor/runtime-candidate/openagent_device_tools-1.0.0b7.dev2026103004-py3-none-any.whl" }
openagent-filesystem = { path = "../server/vendor/runtime-candidate/openagent_filesystem-1.0.0b3.dev2026103002-py3-none-any.whl" }
openagent-editor = { path = "../server/vendor/runtime-candidate/openagent_editor-1.0.0b3.dev2026103002-py3-none-any.whl" }
openagent-shell = { path = "../server/vendor/runtime-candidate/openagent_shell-1.0.0b3.dev2026103002-py3-none-any.whl" }
openagent-execution = { path = "../server/vendor/runtime-candidate/openagent_execution-1.0.0b3.dev2026103002-py3-none-any.whl" }
