[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-cli"
version = "1.1.9b43"
description = "CLI client for OpenAgent — connects to any OpenAgent Gateway"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "openagent-client-transport==1.1.9b43",
    # The CLI network compatibility modules import this package directly.
    "openagent-identity==1.1.9b43",
    "aiohttp>=3.9",
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.48,<4",
    "openagent-host-tools==1.0.0b16",
    # The standalone ``openagent_cli.network`` package implements the
    # client side of Iroh/certificate transport; ``openagent_client_transport``
    # carries the checksum-locked stream/capability protocol shared with the
    # server. Keep dependencies explicit so the wheel remains standalone.
    "iroh==0.35.0",
    "cbor2>=5.6",
    "srptools>=1.0",
    # 46.0.3 is the newest cryptography release with a Windows ARM64 wheel.
    # Pin that platform to the published ABI3 artifact instead of attempting an
    # OpenSSL source build on every user/release install. Other platforms remain
    # on the normal rolling lower bound.
    "cryptography>=42; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "cryptography==46.0.3; platform_system == 'Windows' and platform_machine == 'ARM64'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_cli*"]
namespaces = false

[project.scripts]
openagent-cli = "openagent_cli.main:main"

# Independently released, checksum-pinned SDK dependencies.
[tool.uv]
constraint-dependencies = [
    "openagent-capability-host @ https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.40/openagent_capability_host-1.0.0b3-py3-none-any.whl?download=1#sha256=ad8c5b7ad269db72f79c622af0fd7503c139fc9a065469f00c11b964d1c97218",
    "openagent-connectors @ https://github.com/openagent-uno/openagent-tools/releases/download/v1.0.0-beta.7/openagent_connectors-0.1.15-py3-none-any.whl?download=1#sha256=a67a7a963cc63fcfdd7c80cddc8783773eebdcffdb0fd2354d8064f84e475cb6",
    "openagent-core @ https://github.com/openagent-uno/openagent-core/releases/download/v1.1.0-beta.86/openagent_core-1.1.0b86-py3-none-any.whl?download=1#sha256=75cc525b4c44dc6ae90122a7a09c8e9c8c6b7ea94b2a71a82ca451924c765ae0",
