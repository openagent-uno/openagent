name: Preserve historical Actions artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-actions-preservation
  cancel-in-progress: false
jobs:
  archive:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: [cli, host-tools, app, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve source checksums and private visibility
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CONSOLIDATION_TOKEN }}
        run: |
          python3 scripts/archive-actions-artifacts.py --component '${{ matrix.component }}' --target-commit "$GITHUB_SHA" --state-dir "$RUNNER_TEMP/private-archive-state"
      # Private source names/metadata must never become public Actions artifacts.
