name: Qualify shared desktop native artifacts
on:
  workflow_dispatch:
    inputs:
      tools_sha:
        description: Exact reviewed openagent-tools main source commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: shared-desktop-native-release
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-2022, platform: win32-x64 }
          - { runner: windows-11-arm, platform: win32-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      SOURCE_SHA: ${{ inputs.tools_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent-tools
          ref: ${{ inputs.tools_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable upstream source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git diff --quiet HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision pinned OpenSSL for Windows ARM64
        if: matrix.platform == 'win32-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'openagent-vcpkg'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 114d9fe62faf35856b45cf55cb93b57028a45d63
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install openssl:arm64-windows-static-md
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_DIR=$(Join-Path $vcpkgRoot 'installed\arm64-windows-static-md')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev pkg-config xvfb xauth openbox x11-apps \
            x11-utils x11-xserver-utils
      - name: Keep macOS native dependencies portable and statically bind OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          openssl_root="$(brew --prefix openssl@3)"
          test -f "$openssl_root/lib/libcrypto.a"
          test -f "$openssl_root/lib/libssl.a"
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$openssl_root" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: Build the owning native artifact and SDK
        shell: bash
        working-directory: packages/desktop-tools
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npm run build:native
      - name: Sign and notarize the established helper identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash packages/desktop-tools/scripts/sign-native-macos.sh "packages/desktop-tools/native/${{ matrix.platform }}"
          node packages/desktop-tools/scripts/stage-native.cjs --refresh-manifest
      - name: Verify final bundle hashes and identity-preserving launch
        shell: bash
        working-directory: packages/desktop-tools
        run: node -e "const h=require('./dist').nativeHelper(); if(!h.command||h.version!=='0.1.7')throw Error('unqualified');"
      - uses: actions/upload-artifact@v4
        with:
          name: shared-desktop-native-${{ matrix.platform }}
          path: packages/desktop-tools/native/
          retention-days: 7
          if-no-files-found: error
