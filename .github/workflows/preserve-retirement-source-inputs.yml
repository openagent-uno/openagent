name: Preserve unpublished retirement source inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-update-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify released installer and actual paginated updater
        run: |
          mkdir "$RUNNER_TEMP/public-release-proof"
          cd "$RUNNER_TEMP/public-release-proof"
          gh release download v1.1.8 --repo openagent-uno/openagent --pattern install.sh --pattern manifest.json --pattern 'openagent_framework-*.whl'
          sh install.sh --check
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          manifest=json.loads(Path('manifest.json').read_text())
          wheel=next(Path('.').glob('openagent_framework-*.whl'))
          expected=next(x for x in manifest['wheels'] if x['file']==wheel.name)
          assert hashlib.sha256(wheel.read_bytes()).hexdigest()==expected['sha256']
          sys.path.insert(0,str(wheel.resolve()))
          import openagent_server
          from openagent_server import updater
          assert openagent_server.__version__=='1.1.8'
          releases=updater._release_pages()
          assert len(releases)>100 and len(releases)==len({r['id'] for r in releases})
          assert any(r['tag_name']=='v1.1.8' for r in releases)
          assert all(not r['draft'] for r in releases)
          print('Released 1.1.8 updater verified against '+str(len(releases))+' live public releases; canonical numeric pagination works.')
          PY
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify unpublished inputs and keep their archive private
        env:
          GH_TOKEN: ${{ secrets.RETIREMENT_SOURCE_BACKUP_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,json,os,re,subprocess,tarfile
          spec=importlib.util.spec_from_file_location('migration','scripts/migrate-release-assets.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          try:
              client=m.GitHub('openagent-uno/openagent-app','openagent-uno/openagent')
              backup=client.destination_release('archive-repository-app-2026-11-02')
              assert backup and backup['draft'], 'Source archive must remain private'
              pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp','repos/openagent-uno/openagent-app/releases?per_page=100']))
              selected=[]
              for release in [r for page in pages for r in page if r['draft']]:
                  for a in release['assets']:
                      name=a['name'].lower()
                      source=bool(re.search(r'source|input|provenance|staging|snapshot',name))
                      unknown_archive=name.endswith(('.tar.gz','.tgz','.tar.zst')) and not name.startswith(('openagent-host-tools-','openagent-app-'))
                      if source or unknown_archive or name.endswith(('.json','.txt','.yml','.yaml')):
                          selected.append({'source_tag':release['tag_name'],**a})
              root=Path(os.environ['RUNNER_TEMP'])/'private-unreleased-source';root.mkdir(mode=0o700)
              for a in selected:client.download(a,root/(str(a['id'])+'.bin'))
              (root/'inventory.json').write_text(json.dumps(selected))
              archive=root.parent/'unreleased-source-inputs-verified.tar.gz'
              with tarfile.open(archive,'w:gz') as tar:tar.add(root,arcname='unreleased-source-inputs')
              a=client.upload(backup,archive)
              assert (a['size'],a['digest'])==(archive.stat().st_size,m.digest_file(archive))
              assert client.api('repos/openagent-uno/openagent/releases/'+str(backup['id']))['draft']
              receipt={'backup_release_id':backup['id'],'asset_name':a['name'],'bytes':a['size'],'sha256':a['digest'],'source_assets':len(selected),'source_bytes':sum(x['size'] for x in selected),'verified':True,'private':True}
              (root.parent/'retirement-inputs-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
              print(json.dumps(receipt))
          except Exception as error:
              raise SystemExit('Private source preservation incomplete: '+type(error).__name__) from None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-inputs-receipt
          path: ${{ runner.temp }}/retirement-inputs-receipt.json
          if-no-files-found: error
          retention-days: 14
