name: Publish verified canonical desktop
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful canonical desktop migration build run
        required: true
        type: string
      source_sha:
        description: Exact reviewed build source commit
        required: true
        type: string
      baseline_build_run_id:
        description: Optional five-target baseline when only Windows ARM64 acceptance was repeated
        required: false
        default: ''
        type: string
      existing_draft_release_id:
        description: Optional empty draft already created by a release maintainer
        required: false
        default: ''
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: canonical-desktop-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_SOURCE: ${{ inputs.source_sha }}
      BASELINE_RUN_ID: ${{ inputs.baseline_build_run_id }}
      OWNED_DRAFT_ID: ${{ inputs.existing_draft_release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind publication to the reviewed canonical build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$BUILD_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$BUILD_SOURCE" HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('build-run.json'))
          assert run['path']=='.github/workflows/desktop-canonical-release.yml'
          assert run['head_sha']==os.environ['BUILD_SOURCE']
          assert run['head_branch']=='main' and run['event']=='workflow_dispatch'
          PY
          test ! -e .canonical-publication
          mkdir .canonical-publication
          gh run watch "$BUILD_RUN_ID" --exit-status --interval 30
          python3 - <<'PY'
          import json,os,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+path]))
          jobs=api('/actions/runs/'+os.environ['BUILD_RUN_ID']+'/jobs?per_page=100')['jobs']
          baseline=os.environ.get('BASELINE_RUN_ID','')
          if baseline:
              assert baseline.isdigit()
              run=api('/actions/runs/'+baseline)
              assert run['path']=='.github/workflows/desktop-canonical-release.yml'
              assert run['head_branch']=='main' and run['event']=='workflow_dispatch' and run['status']=='completed'
              source=run['head_sha']
              subprocess.run(['git','merge-base','--is-ancestor',source,os.environ['BUILD_SOURCE']],check=True)
              changed=subprocess.check_output(['git','diff','--name-only',source,os.environ['BUILD_SOURCE'],'--','apps/app'],text=True).splitlines()
              allowed={'apps/app/desktop/scripts/test-packaged-artifacts.mjs','apps/app/desktop/scripts/canonical-update-feed.js','apps/app/desktop/scripts/__tests__/canonical-update-feed.test.mjs'}
              assert set(changed)<=allowed, 'Runtime, renderer, package, lock or bundle inputs changed: rebuild all targets'
              assert len(jobs)==1 and 'win32-arm64' in jobs[0]['name'] and jobs[0]['conclusion']=='success'
              old=api('/actions/runs/'+baseline+'/jobs?per_page=100')['jobs']
              for platform in ['darwin-arm64','darwin-x64','win32-x64','linux-arm64','linux-x64']:
                  matches=[j for j in old if ', '+platform+',' in j['name']]
                  assert len(matches)==1 and matches[0]['conclusion']=='success'
              with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('BASELINE_SOURCE='+source+'\n')
          else:
              assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs)
          PY
          test "$(git show "$BUILD_SOURCE:apps/app/desktop/package.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$(node -p 'require("./apps/app/desktop/package.json").version')"
          echo "APP_TAG=app-v$(node -p 'require("./apps/app/desktop/package.json").version')" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p 'require("./apps/app/desktop/package.json").version')" >> "$GITHUB_ENV"
          echo "HOST_TOOLS_VERSION=$(node -p 'require("./apps/app/desktop/host-tools.lock.json").version')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked verifier dependencies
        run: npm --prefix apps/app/desktop ci --no-fund --no-audit
      - uses: actions/download-artifact@v4
        if: inputs.baseline_build_run_id != ''
        with:
          run-id: ${{ inputs.baseline_build_run_id }}
          github-token: ${{ github.token }}
          pattern: desktop-*
          path: .canonical-publication/artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: desktop-*
          path: .canonical-publication/artifacts
      - name: Verify the complete six-platform asset set and generate the canonical feed
        run: |
          node apps/app/desktop/scripts/merge-update-metadata.js .canonical-publication/artifacts .canonical-publication/artifacts/release-metadata
          node apps/app/desktop/scripts/verify-release-set.mjs .canonical-publication/artifacts
          node apps/app/desktop/scripts/canonical-update-feed.js .canonical-publication/artifacts .canonical-publication/artifacts/release-metadata .canonical-publication/canonical-feed "$APP_TAG"
      - name: Refuse to replace an immutable App release
        env:
          GH_TOKEN: ${{ secrets.CANONICAL_RELEASE_PUBLISH_TOKEN || github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases?per_page=100']))
          matches=[r for p in pages for r in p if r['tag_name']==os.environ['APP_TAG']]
          draft_id=os.environ['OWNED_DRAFT_ID']
          if draft_id:
              assert draft_id.isdigit() and len(matches)==1
              draft=matches[0]
              assert draft['id']==int(draft_id) and draft['draft'] and draft['prerelease']
              assert not draft['assets'] and draft['target_commitish']==os.environ['BUILD_SOURCE']
          else:
              assert not matches, 'App release already exists; use a new version'
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'
          tag=os.environ['APP_TAG']
          existing=subprocess.run(['gh','api',endpoint+'ref/tags/'+tag],capture_output=True,text=True)
          if existing.returncode:
              subprocess.run(['gh','api','--method','POST',endpoint+'refs','--input','-'],input=json.dumps({'ref':'refs/tags/'+tag,'sha':os.environ['BUILD_SOURCE']}),text=True,check=True,capture_output=True)
          else:
              assert json.loads(existing.stdout)['object']['sha']==os.environ['BUILD_SOURCE']
          PY
      - name: Stage a private App release
        id: draft
        if: inputs.existing_draft_release_id == ''
        uses: softprops/action-gh-release@v2.6.2
        with:
          token: ${{ secrets.CANONICAL_RELEASE_PUBLISH_TOKEN || github.token }}
          tag_name: ${{ env.APP_TAG }}
          target_commitish: ${{ inputs.source_sha }}
          name: OpenAgent App ${{ env.APP_VERSION }}
          body: |
            Long sessions scroll infinitely in both directions, a rail of prompt dots previews and jumps to any turn (full rail with Server beta 36), auto-scroll stays attached at the bottom, and working sessions and runs shine in the sidebar. This release uses Host Tools ${{ env.HOST_TOOLS_VERSION }}.

            Existing application ID, protocol, profiles and consents are preserved. macOS ARM64/x64 signed and notarized; all six packaged targets passed native artifact and launch checks. Windows Authenticode, two physical remote machines and live-provider acceptance are not claimed.

            Builds using retired repository updater URLs require a manual upgrade. Replace the existing installation without erasing its profile.

            Build source: ${{ inputs.source_sha }}; run ${{ inputs.build_run_id }}. Optional five-target baseline: ${{ env.BASELINE_SOURCE }}; run ${{ inputs.baseline_build_run_id }}. Reuse is permitted only when runtime, renderer, package, dependency lock and native bundle inputs are unchanged; the diff gate permits acceptance/publication helper changes only.
          draft: true
          prerelease: true
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            .canonical-publication/artifacts/**/*.dmg
            .canonical-publication/artifacts/**/*.zip
            .canonical-publication/artifacts/**/*.exe
            .canonical-publication/artifacts/**/*.AppImage
            .canonical-publication/artifacts/**/*.deb
            .canonical-publication/artifacts/release-metadata/*.yml
            .canonical-publication/artifacts/**/*.blockmap
            .canonical-publication/artifacts/**/*.sha256
            .canonical-publication/artifacts/**/release-manifest-*.json
      - name: Upload qualified assets to the owned draft
        if: inputs.existing_draft_release_id != ''
        run: |
          python3 - <<'PY'
          import hashlib,importlib.util,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('migration','scripts/migrate-release-assets.py')
          migration=importlib.util.module_from_spec(spec);spec.loader.exec_module(migration)
          repo=os.environ['GITHUB_REPOSITORY']
          client=migration.GitHub(repo,repo)
          draft=client.api('repos/'+repo+'/releases/'+os.environ['OWNED_DRAFT_ID'])
          assert draft['tag_name']==os.environ['APP_TAG'] and draft['draft'] and not draft['assets']
          root=Path('.canonical-publication/artifacts')
          patterns=('**/*.dmg','**/*.zip','**/*.exe','**/*.AppImage','**/*.deb',
                    'release-metadata/*.yml','**/*.blockmap','**/*.sha256','**/release-manifest-*.json')
          for asset in sorted({asset for pattern in patterns for asset in root.glob(pattern)}):
              with asset.open('rb') as data:
                  expected=(asset.stat().st_size,'sha256:'+hashlib.file_digest(data,'sha256').hexdigest())
              uploaded=client.upload(draft,asset)
              assert (uploaded['size'],uploaded['digest'])==expected
          PY
      - name: Verify uploaded hashes before publication
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id || env.OWNED_DRAFT_ID }}
          GH_TOKEN: ${{ secrets.CANONICAL_RELEASE_PUBLISH_TOKEN || github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-draft.json
          node apps/app/desktop/scripts/verify-release-set.mjs .canonical-publication/artifacts --release-json release-draft.json --expect-draft true --expect-prerelease true
          echo '{"draft":false,"prerelease":true,"make_latest":"false"}' > publish.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input publish.json > release-published.json
          node apps/app/desktop/scripts/verify-release-set.mjs .canonical-publication/artifacts --release-json release-published.json --expect-draft false --expect-prerelease true
      - name: Publish verified channel metadata without changing immutable installers
        env:
          GH_TOKEN: ${{ secrets.CANONICAL_RELEASE_PUBLISH_TOKEN || github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util,json,os,hashlib,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('migration','scripts/migrate-release-assets.py')
          migration=importlib.util.module_from_spec(spec);spec.loader.exec_module(migration)
          repo=os.environ['GITHUB_REPOSITORY'];client=migration.GitHub(repo,repo)
          feed=client.destination_release('app-update-feed')
          if feed is None:
              ref=subprocess.run(['gh','api','repos/'+repo+'/git/ref/tags/app-update-feed'],capture_output=True,text=True)
              if ref.returncode:
                  client.api('repos/'+repo+'/git/refs','POST',{'ref':'refs/tags/app-update-feed','sha':os.environ['GITHUB_SHA']})
              feed=client.api('repos/'+repo+'/releases','POST',{'tag_name':'app-update-feed','target_commitish':os.environ['GITHUB_SHA'],'name':'App update channel metadata','body':'Mutable channel metadata only. Installers remain immutable under versioned App tags.','draft':True,'prerelease':True,'make_latest':'false'})
              client.release_ids['app-update-feed']=feed['id']
          for path in sorted(Path('.canonical-publication/canonical-feed').glob('*.yml')):
              expected=(path.stat().st_size,'sha256:'+hashlib.sha256(path.read_bytes()).hexdigest())
              old=next((a for a in feed['assets'] if a['name']==path.name),None)
              if old and (old['size'],old.get('digest'))==expected:continue
              if old:client.api('repos/'+repo+'/releases/assets/'+str(old['id']),'DELETE')
              new=client.upload(feed,path)
              assert (new['size'],new['digest'])==expected
          feed=client.api('repos/'+repo+'/releases/'+str(feed['id']))
          for path in Path('.canonical-publication/canonical-feed').glob('*.yml'):
              asset=next(a for a in feed['assets'] if a['name']==path.name)
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          published=client.finish(feed,{'draft':False,'prerelease':True})
          assert published['tag_name']=='app-update-feed' and not published['draft']
          print('Canonical App release and all four channel metadata assets verified and published')
          PY
