name: Canonical desktop migration build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed canonical main commit with sealed public dependencies
        required: true
        type: string

      target:
        description: All targets or one diagnostic target
        required: true
        type: choice
        options: [all, win32-arm64]
        default: all

      existing_failed_run_id:
        description: Optional reviewed failed Windows build whose exact installer is requalified
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-canonical-migration
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.target == 'win32-arm64' && '[{"runner":"windows-11-arm","platform":"win32-arm64","script":"build:win","arch":"--arm64"}]' || '[{"runner":"macos-15","platform":"darwin-arm64","script":"build:mac","arch":"--arm64"},{"runner":"macos-15-intel","platform":"darwin-x64","script":"build:mac","arch":"--x64"},{"runner":"ubuntu-24.04","platform":"linux-x64","script":"build:linux","arch":"--x64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64","script":"build:linux","arch":"--arm64"},{"runner":"windows-2022","platform":"win32-x64","script":"build:win","arch":"--x64"},{"runner":"windows-11-arm","platform":"win32-arm64","script":"build:win","arch":"--arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
        working-directory: apps/app
    env:
      CARGO_BUILD_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      npm_config_jobs: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the immutable reviewed main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git diff --quiet HEAD
          node -e 'const d=require("./desktop/package.json"),u=require("./universal/package.json"); if(d.version!==u.version)throw Error("desktop/universal version mismatch")'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}
      - name: Validate the immutable Windows recovery input
        if: inputs.existing_failed_run_id != ''
        env:
          FAILED_RUN: ${{ inputs.existing_failed_run_id }}
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PYTHON'
          import subprocess,json,os
          assert os.environ['TARGET']=='win32-arm64' and os.environ['FAILED_RUN'].isdigit()
          run=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['FAILED_RUN']]))
          assert run['path']=='.github/workflows/desktop-canonical-release.yml' and run['head_branch']=='main' and run['event']=='workflow_dispatch'
          assert run['status']=='completed'
          changed=subprocess.check_output(['git','diff','--name-only',run['head_sha'],'HEAD','--','apps/app'],text=True).splitlines()
          allowed={'apps/app/desktop/scripts/test-packaged-artifacts.mjs','apps/app/desktop/scripts/canonical-update-feed.js','apps/app/desktop/scripts/__tests__/canonical-update-feed.test.mjs'}
          assert set(changed)<=allowed, 'Runtime inputs differ; rebuild the installer'
          print('Recovering an unchanged reviewed installer; acceptance helper changes only')
          PYTHON
      - uses: actions/download-artifact@v4
        if: inputs.existing_failed_run_id != ''
        with:
          run-id: ${{ inputs.existing_failed_run_id }}
          github-token: ${{ github.token }}
          name: diagnostic-win32-arm64
          path: apps/app/desktop/release
      - name: Check the installer as a GUI process with owned long-path scratch
        if: inputs.existing_failed_run_id != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem desktop/release/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one reviewed installer' }
          $target = Join-Path $env:RUNNER_TEMP 'openagent-native-installer-proof'
          if (Test-Path $target) { throw 'Owned proof target already exists' }
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$target") -PassThru
          $exited = $process.WaitForExit(90000)
          Write-Host "Installer PID $($process.Id); exited=$exited; payload=$((Test-Path (Join-Path $target 'resources/app.asar')))"
          if (-not $exited) {
            Get-Process | Where-Object { $_.ProcessName -like '*openagent*' -or $_.ProcessName -like '*powershell*' } | Select-Object Id,ProcessName,Path,MainWindowTitle | Format-List
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Reviewed GUI installer did not exit before the bounded deadline'
          }
          if ($process.ExitCode -ne 0) { throw "Installer exit $($process.ExitCode)" }
          $proof = Join-Path $env:RUNNER_TEMP 'openagent-native-verifier'
          New-Item -ItemType Directory -Path "$proof/desktop/scripts" -Force | Out-Null
          Copy-Item desktop/package.json "$proof/desktop/package.json"
          Copy-Item desktop/scripts/*.mjs "$proof/desktop/scripts/"
          Copy-Item desktop/release "$proof/desktop/release" -Recurse
          Copy-Item $target "$proof/desktop/release/win-arm64-unpacked" -Recurse
          $lock = Get-Content desktop/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $helpers = @{ private=$true; dependencies=@{ '@electron/asar'=$lock.packages['node_modules/@electron/asar'].version; 'js-yaml'=$lock.packages['node_modules/js-yaml'].version; 'app-builder-lib'=$lock.packages['node_modules/app-builder-lib'].version } }
          $helpers.overrides = @{ 'app-builder-lib' = @{ '@noble/hashes' = '1.8.0' } }
          $helpers | ConvertTo-Json -Depth 5 | Set-Content "$proof/package.json" -Encoding utf8
          & npm --prefix $proof install --ignore-scripts --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'Verifier dependency installation failed' }
          Push-Location $proof
          $payload = Join-Path "$proof/desktop/release" $installer[0].Name
          & node -e "require('app-builder-lib/out/targets/blockmap/blockmap.js').buildBlockMap(process.argv[1], 'gzip', process.argv[1]+'.blockmap').catch(e=>{console.error(e);process.exit(1)})" $payload
          if ($LASTEXITCODE -ne 0) { throw 'Blockmap generation failed' }
          Pop-Location
          "ACCEPTANCE_DESKTOP=$proof/desktop" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked client dependencies
        if: inputs.existing_failed_run_id == ''
        run: |
          npm --prefix universal ci --no-fund --no-audit
          npm --prefix desktop ci --no-fund --no-audit
      - name: Build the renderer
        if: inputs.existing_failed_run_id == ''
        run: |
          cd universal
          npx expo export --platform web
      - name: Acquire the exact public host bundle
        if: inputs.existing_failed_run_id == ''
        run: node desktop/scripts/fetch-host-tools-release.js ${{ matrix.platform }} .release-deps/host-tools-dist
      - name: Stage the renderer without changing source
        if: inputs.existing_failed_run_id == ''
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          fs.cpSync('universal/dist','desktop/web-build',{recursive:true,errorOnExist:true});
          const index='desktop/web-build/index.html';
          fs.writeFileSync(index,fs.readFileSync(index,'utf8').replace(/(href|src)="\//g,'$1="./'));
          NODE
      - name: Package the native target without publication
        if: inputs.existing_failed_run_id == ''
        working-directory: apps/app/desktop
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.LEGACY_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.LEGACY_APP_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.LEGACY_APP_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.LEGACY_APP_APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.LEGACY_APP_APPLE_TEAM_ID || '' }}
          OPENAGENT_HOST_TOOLS_DIST: ${{ github.workspace }}/apps/app/.release-deps/host-tools-dist
        run: npm run ${{ matrix.script }} -- ${{ matrix.arch }} --publish never --config.publish.channel beta
      - name: Verify packaged payloads and update metadata
        working-directory: apps/app/desktop
        env:
          REQUIRE_SIGNED: ${{ runner.os == 'macOS' && 'true' || 'false' }}
        run: |
          if [[ -n "${ACCEPTANCE_DESKTOP:-}" ]]; then
            node "$ACCEPTANCE_DESKTOP/scripts/test-packaged-artifacts.mjs" ${{ matrix.platform }}
            node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const from=path.join(process.env.ACCEPTANCE_DESKTOP,'release');
          for(const entry of fs.readdirSync(from,{withFileTypes:true}))if(entry.isFile())fs.copyFileSync(path.join(from,entry.name),path.join('release',entry.name));
          NODE
          else
            node scripts/test-packaged-artifacts.mjs ${{ matrix.platform }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/app/desktop/release/*.dmg
            apps/app/desktop/release/*.zip
            apps/app/desktop/release/*.exe
            apps/app/desktop/release/*.AppImage
            apps/app/desktop/release/*.deb
            apps/app/desktop/release/*.yml
            apps/app/desktop/release/*.blockmap
            apps/app/desktop/release/*.sha256
            apps/app/desktop/release/release-manifest-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed-target installers for owned diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.platform }}
          path: |
            apps/app/desktop/release/*.exe
            apps/app/desktop/release/*.yml
          if-no-files-found: ignore
          retention-days: 3
