name: Host tools native bundles

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed canonical main commit for Host Tools B7
        required: true
        type: string
      signing_mode:
        description: Sign macOS in CI, or build unsigned candidates for local signing
        required: true
        type: choice
        options:
          - ci
          - local
        default: local

permissions:
  contents: read

concurrency:
  group: host-tools-native-qualification
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOURCE_SHA: ${{ inputs.source_sha }}
  CARGO_BUILD_JOBS: 1
  CMAKE_BUILD_PARALLEL_LEVEL: 1
  UV_CONCURRENT_BUILDS: 1
  UV_CONCURRENT_DOWNLOADS: 4
  UV_CONCURRENT_INSTALLS: 2
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  signing-inputs:
    if: inputs.signing_mode == 'ci'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the existing Apple release credentials on this repository
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing repository secret: $name" >&2; exit 1; }
          done

  bundle:
    needs: signing-inputs
    if: ${{ !cancelled() && (inputs.signing_mode == 'local' || needs.signing-inputs.result == 'success') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-2022, platform: win32-x64 }
          - { runner: windows-11-arm, platform: win32-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an immutable main source commit
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(python -c 'exec(open("packages/host-tools/src/openagent_host_tools/_version.py").read()); print(__version__)')" = 1.0.0b7
          git diff --quiet HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision pinned OpenSSL for Windows ARM64
        if: matrix.platform == 'win32-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'openagent-vcpkg'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 114d9fe62faf35856b45cf55cb93b57028a45d63
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install openssl:arm64-windows-static-md
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_DIR=$(Join-Path $vcpkgRoot 'installed\arm64-windows-static-md')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev pkg-config xvfb xauth openbox x11-apps \
            x11-utils x11-xserver-utils
      - name: Keep macOS native dependencies portable and statically bind OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          openssl_root="$(brew --prefix openssl@3)"
          test -f "$openssl_root/lib/libcrypto.a"
          test -f "$openssl_root/lib/libssl.a"
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$openssl_root" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: Install verified public dependencies and the fresh canonical wheel
        shell: bash
        run: |
          set -euo pipefail
          python packages/host-tools/scripts/prepare_public_wheels.py wheelhouse
          python -m pip install uv==0.11.14
          uv build --wheel --out-dir candidate-wheel packages/host-tools
          uv sync --project packages/host-tools --locked --no-editable --extra dev --extra build
          python - <<'PYTHON'
          import os
          from pathlib import Path
          scripts = Path.cwd() / "packages/host-tools/.venv" / ("Scripts" if os.name == "nt" else "bin")
          executable = scripts / ("python.exe" if os.name == "nt" else "python")
          import subprocess
          subprocess.run(["uv", "pip", "check", "--python", str(executable)], check=True)
          with open("wheelhouse/install-freeze.txt", "w") as receipt:
              subprocess.run(["uv", "pip", "freeze", "--python", str(executable)], check=True, stdout=receipt)
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(scripts) + "\n")
          PYTHON
      - name: Test the host-tools package
        shell: bash
        run: python -m pytest packages/host-tools/tests -q
      - name: Build bundle with required sidecars
        run: python packages/host-tools/scripts/build_standalone.py --require-sidecars --expect-platform ${{ matrix.platform }}
      - name: Sign and notarize macOS executables
        if: runner.os == 'macOS' && inputs.signing_mode == 'ci'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          packages/host-tools/scripts/sign_macos_bundle.sh \
            "packages/host-tools/dist/${{ matrix.platform }}"
          python packages/host-tools/scripts/build_standalone.py \
            --manifest-only --expect-platform ${{ matrix.platform }}
      - name: Verify sidecar catalog and native behavior on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packages/host-tools/scripts/snapshot_sidecar_manifests.py \
            "packages/host-tools/dist/${{ matrix.platform }}" --check
          python packages/host-tools/scripts/smoke_bundle.py \
            "packages/host-tools/dist/${{ matrix.platform }}" --computer-control expect-granted
      - name: Verify sidecar catalog and native behavior on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packages/host-tools/scripts/snapshot_sidecar_manifests.py \
            "packages/host-tools/dist/${{ matrix.platform }}" --check
          if [[ "${{ matrix.platform }}" == linux-x64 ]]; then
            xvfb-run -a -s '-screen 0 1280x1024x24' \
              packages/host-tools/scripts/smoke_linux_xvfb.sh \
              "packages/host-tools/dist/${{ matrix.platform }}"
          else
            xvfb-run -a -s '-screen 0 1280x1024x24' \
              packages/host-tools/scripts/smoke_linux_xvfb.sh \
              "packages/host-tools/dist/${{ matrix.platform }}" --core-only
          fi
      - name: Verify sidecar catalog and native behavior on Windows
        if: runner.os == 'Windows'
        run: |
          python packages/host-tools/scripts/snapshot_sidecar_manifests.py "packages/host-tools/dist/${{ matrix.platform }}" --check
          python packages/host-tools/scripts/smoke_bundle.py "packages/host-tools/dist/${{ matrix.platform }}" --computer-control expect-granted
      - name: Package and verify the native archive
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python packages/host-tools/scripts/package_bundle.py \
            "packages/host-tools/dist/${{ matrix.platform }}"
          if [[ "${{ runner.os }}" == macOS && "${{ inputs.signing_mode }}" == ci ]]; then
            packages/host-tools/scripts/verify_macos_archive.sh \
              "packages/host-tools/dist/openagent-host-tools-${{ matrix.platform }}.tar.gz"
          fi
          python packages/host-tools/scripts/verify_bundle_archive.py \
            "packages/host-tools/dist/openagent-host-tools-${{ matrix.platform }}.tar.gz" \
            "$RUNNER_TEMP/verified-${{ matrix.platform }}" \
            --expect-platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-tools-dependencies-${{ matrix.platform }}
          path: |
            wheelhouse/dependency-receipt.json
            wheelhouse/install-freeze.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools-${{ matrix.platform }}
          path: |
            packages/host-tools/dist/openagent-host-tools-${{ matrix.platform }}.tar.gz
            packages/host-tools/dist/openagent-host-tools-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: bundle
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: host-tools-@(darwin|linux|win32)-*
          path: dist
          merge-multiple: true
      - name: Build the canonical host-tools wheel from the same immutable source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet HEAD
          python -m pip install uv==0.11.14
          uv build --wheel --out-dir dist packages/host-tools
      - name: Verify all six native archives and produce the candidate consumer lock
        shell: bash
        run: |
          set -euo pipefail
          python packages/host-tools/scripts/release_index.py dist \
            --source-commit "$SOURCE_SHA" \
            --source-repository openagent-uno/openagent
          test -s dist/release-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools-candidate-metadata
          path: |
            dist/release-index.json
            dist/openagent_host_tools-*.whl
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools-${{ inputs.signing_mode }}-candidate
          path: |
            dist/openagent-host-tools-*.tar.gz
            dist/openagent-host-tools-*.tar.gz.sha256
            dist/openagent_host_tools-*.whl
            dist/release-index.json
          if-no-files-found: error
          retention-days: 14
