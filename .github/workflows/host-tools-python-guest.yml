name: Qualify Python guest Host Tools
on:
  workflow_dispatch:
  push:
    tags: ['host-tools-python-v*']

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - name: Build the guest and check its release identity
        run: |
          python packages/host-tools/scripts/guest_python_release.py "$RUNNER_TEMP/guest"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$(jq -r .tag "$RUNNER_TEMP/guest/manifest.json")"
          fi
      - name: Verify an installed wheel inside a fresh Linux environment
        run: |
          python -m venv "$RUNNER_TEMP/guest-env"
          python - "$RUNNER_TEMP/guest" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_bytes())
          wheel, = manifest["wheels"]
          url = "https://github.com/openagent-uno/openagent/releases/download/" + manifest["tag"] + "/" + wheel["file"]
          requirements = (root / "guest-requirements.txt").read_text()
          assert requirements.count(url) == 1
          (root.parent / "guest-test.txt").write_text(requirements.replace(url, (root / wheel["file"]).as_uri()))
          PY
          "$RUNNER_TEMP/guest-env/bin/pip" install --require-hashes -r "$RUNNER_TEMP/guest-test.txt"
          "$RUNNER_TEMP/guest-env/bin/pip" check
          "$RUNNER_TEMP/guest-env/bin/pip" install pytest pytest-asyncio
          "$RUNNER_TEMP/guest-env/bin/python" -I -m pytest packages/host-tools/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-tools-python-guest
          path: ${{ runner.temp }}/guest/*
          if-no-files-found: error
          retention-days: 5

  publish:
    if: github.ref_type == 'tag'
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-tools-python-guest
          path: guest
      - name: Publish the qualified Python assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" guest/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenAgent Host Tools Python ${GITHUB_REF_NAME#host-tools-python-v}" \
            --notes "Install the Python guest into a virtual environment with pip install --require-hashes -r guest-requirements.txt. Native bundles are distributed separately." \
            --prerelease --latest=false
