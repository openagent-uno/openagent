name: Qualify and release immutable Python product wheels
on:
  workflow_dispatch:
    inputs:
      app_only:
        description: Qualify independently versioned App source without rebuilding Python wheels
        type: boolean
        default: false
  push:
    tags: ['v1.1.9-beta.*']
permissions:
  contents: read
jobs:
  qualify-host-instance:
    if: github.event_name != 'workflow_dispatch' || !inputs.app_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install filelock==3.32.7
      - name: Verify exclusive host ownership and crash recovery on the actual OS
        env:
          PYTHONPATH: apps/server/src
        run: python -m unittest discover -s tests -p test_serve_instance.py -v
  qualify:
    if: github.event_name != 'workflow_dispatch' || !inputs.app_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - name: Verify checked-in source resolution before building
        run: |
          uv lock --check --project apps/server
          uv lock --check --project apps/cli
          uv lock --check --project packages/host-tools
      - name: Resolve current public dependencies and build the product from one clean source
        env:
          OPENAGENT_RELEASE_TOKEN: ${{ github.token }}
        run: python scripts/build_wheels.py --out "$RUNNER_TEMP/product-wheels" --components server cli mcp-bridge identity dashboards integrations-support client-transport product-config
      - name: Install the pinned public dependency closure and candidate wheels
        env:
          OPENAGENT_INSTALL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 https://github.com/openagent-uno/openagent/releases/download/v1.1.9-beta.13/install.sh -o "$RUNNER_TEMP/bootstrap.sh"
          echo "da3fdb59cd59fb6a58a878e4fc55d03227647621791dbb07a7d2b774ee45ff85  $RUNNER_TEMP/bootstrap.sh" | sha256sum --check
          # The pinned installer reads release manifests through the GitHub
          # API without a token, and the shared runner quota is easily
          # exhausted ("403 rate limit exceeded"). After the checksum check,
          # run a copy that sends this job's token to api.github.com only
          # (never to the asset download hosts), then still retry with
          # backoff from a clean root.
          python3 - "$RUNNER_TEMP/bootstrap.sh" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = "Request(url, headers=headers)"
          new = ("Request(url, headers=({**headers, 'Authorization': 'Bearer ' + __import__('os').environ['OPENAGENT_INSTALL_GITHUB_TOKEN']}"
                 " if url.startswith('https://api.github.com/') and __import__('os').environ.get('OPENAGENT_INSTALL_GITHUB_TOKEN')"
                 " else headers))")
          assert text.count(old) == 1, "installer fetch changed"
          path.with_name("bootstrap-auth.sh").write_text(text.replace(old, new))
          PY
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/qualified-base" "$RUNNER_TEMP/qualified-bin"
            if OPENAGENT_INSTALL_ROOT="$RUNNER_TEMP/qualified-base" sh "$RUNNER_TEMP/bootstrap-auth.sh" --server --prefix "$RUNNER_TEMP/qualified-bin"; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            echo "Installer attempt $attempt failed; retrying in $((attempt * 90))s"
            sleep $((attempt * 90))
          done
          PYTHON="$RUNNER_TEMP/qualified-base/venv/bin/python"
          "$PYTHON" -m pip install pytest pytest-asyncio pytest-subtests
          "$PYTHON" scripts/qualify_python_product.py --wheels "$RUNNER_TEMP/product-wheels"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-product-${{ github.sha }}
          path: ${{ runner.temp }}/product-wheels/*
          if-no-files-found: error
          retention-days: 5
  qualify-session-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked App dependencies
        run: |
          npm --prefix apps/app/universal ci --no-fund --no-audit
          npm --prefix apps/app/desktop ci --no-fund --no-audit
      - name: Check types and shared interaction policies
        working-directory: apps/app
        run: |
          (cd universal && npx tsc --noEmit)
          npm --prefix desktop test
          node --experimental-strip-types --test common/__tests__/*.test.mjs
      - name: Build and verify responsive sharing and desktop input twice
        working-directory: apps/app
        env:
          OPENAGENT_DEVICE_UI_EVIDENCE: ${{ runner.temp }}/session-ui-evidence
        run: |
          npm --prefix universal run build:web
          (cd desktop && xvfb-run -a npx playwright test e2e/desktop-devices.spec.mjs e2e/desktop-models.spec.mjs --repeat-each=2 --workers=1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: session-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/session-ui-evidence
            apps/app/desktop/test-results
          if-no-files-found: ignore
          retention-days: 5
  publish:
    needs: [qualify, qualify-session-ui, qualify-host-instance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.1.9-beta.') && github.repository == 'openagent-uno/openagent'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-product-${{ github.sha }}
          path: product-wheels
      - name: Publish qualified immutable wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Preserve the existing release; assets are immutable.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" product-wheels/* --verify-tag --prerelease --title "$RELEASE_TAG" --notes 'Qualified public Python wheel cohort. Native App and Host Tools remain independently versioned. See manifest.json for exact source and artifact digests.'
