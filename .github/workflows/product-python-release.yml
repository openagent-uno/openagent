name: Qualify and release immutable Python product wheels
on:
  workflow_dispatch:
  push:
    tags: ['v1.1.9-beta.*']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - name: Build the seven product packages from one clean source
        run: python scripts/build_wheels.py --out "$RUNNER_TEMP/product-wheels" --components server cli mcp-bridge identity dashboards integrations-support client-transport
      - name: Install the pinned public dependency closure and candidate wheels
        run: |
          curl --fail --location --retry 3 https://github.com/openagent-uno/openagent/releases/download/v1.1.9-beta.10/install.sh -o "$RUNNER_TEMP/bootstrap.sh"
          echo "4b765f994e365fc0cc9c7a4a645b8862b60fb3559e121462ac070672e55947b9  $RUNNER_TEMP/bootstrap.sh" | sha256sum --check
          OPENAGENT_INSTALL_ROOT="$RUNNER_TEMP/qualified-base" sh "$RUNNER_TEMP/bootstrap.sh" --server --prefix "$RUNNER_TEMP/qualified-bin"
          PYTHON="$RUNNER_TEMP/qualified-base/venv/bin/python"
          "$PYTHON" -m pip install pytest pytest-asyncio pytest-subtests
          "$PYTHON" scripts/qualify_python_product.py --wheels "$RUNNER_TEMP/product-wheels"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-product-${{ github.sha }}
          path: ${{ runner.temp }}/product-wheels/*
          if-no-files-found: error
          retention-days: 5
  publish:
    needs: qualify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.1.9-beta.') && github.repository == 'openagent-uno/openagent'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-product-${{ github.sha }}
          path: product-wheels
      - name: Publish qualified immutable wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Preserve the existing release; assets are immutable.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" product-wheels/* --verify-tag --prerelease --title "$RELEASE_TAG" --notes 'Qualified public Python wheel cohort. Native App and Host Tools remain independently versioned. See manifest.json for exact source and artifact digests.'
