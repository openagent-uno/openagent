name: Verify migrated signing settings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare sealed source fingerprints without exposing values
        env:
          LEGACY_SERVER_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.LEGACY_SERVER_APPLE_APP_SPECIFIC_PASSWORD }}
          LEGACY_SERVER_APPLE_ID: ${{ secrets.LEGACY_SERVER_APPLE_ID }}
          LEGACY_SERVER_APPLE_TEAM_ID: ${{ secrets.LEGACY_SERVER_APPLE_TEAM_ID }}
          LEGACY_SERVER_CSC_KEY_PASSWORD: ${{ secrets.LEGACY_SERVER_CSC_KEY_PASSWORD }}
          LEGACY_SERVER_CSC_LINK: ${{ secrets.LEGACY_SERVER_CSC_LINK }}
          LEGACY_SERVER_CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.LEGACY_SERVER_CSC_KEY_PASSWORD_INSTALLER }}
          LEGACY_SERVER_CSC_LINK_INSTALLER: ${{ secrets.LEGACY_SERVER_CSC_LINK_INSTALLER }}
          LEGACY_CLI_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.LEGACY_CLI_APPLE_APP_SPECIFIC_PASSWORD }}
          LEGACY_CLI_APPLE_ID: ${{ secrets.LEGACY_CLI_APPLE_ID }}
          LEGACY_CLI_APPLE_TEAM_ID: ${{ secrets.LEGACY_CLI_APPLE_TEAM_ID }}
          LEGACY_CLI_CSC_KEY_PASSWORD: ${{ secrets.LEGACY_CLI_CSC_KEY_PASSWORD }}
          LEGACY_CLI_CSC_LINK: ${{ secrets.LEGACY_CLI_CSC_LINK }}
          LEGACY_CLI_CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.LEGACY_CLI_CSC_KEY_PASSWORD_INSTALLER }}
          LEGACY_CLI_CSC_LINK_INSTALLER: ${{ secrets.LEGACY_CLI_CSC_LINK_INSTALLER }}
          LEGACY_APP_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.LEGACY_APP_APPLE_APP_SPECIFIC_PASSWORD }}
          LEGACY_APP_APPLE_ID: ${{ secrets.LEGACY_APP_APPLE_ID }}
          LEGACY_APP_APPLE_TEAM_ID: ${{ secrets.LEGACY_APP_APPLE_TEAM_ID }}
          LEGACY_APP_CSC_KEY_PASSWORD: ${{ secrets.LEGACY_APP_CSC_KEY_PASSWORD }}
          LEGACY_APP_CSC_LINK: ${{ secrets.LEGACY_APP_CSC_LINK }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.CSC_KEY_PASSWORD_INSTALLER }}
          CSC_LINK_INSTALLER: ${{ secrets.CSC_LINK_INSTALLER }}
          SIGNING_MIGRATION_EXPECTED_SERVER: ${{ secrets.SIGNING_MIGRATION_EXPECTED_SERVER }}
          SIGNING_MIGRATION_EXPECTED_CLI: ${{ secrets.SIGNING_MIGRATION_EXPECTED_CLI }}
          SIGNING_MIGRATION_EXPECTED_APP: ${{ secrets.SIGNING_MIGRATION_EXPECTED_APP }}
        run: |
          python3 - <<'PY'
          import os,json,hmac,hashlib
          verified=0
          for component in ['SERVER','CLI','APP']:
              expected=json.loads(os.environ['SIGNING_MIGRATION_EXPECTED_'+component])
              for name,fingerprint in expected['fingerprints'].items():
                  actual=hmac.new(bytes.fromhex(expected['nonce']),os.environ[name].encode(),hashlib.sha256).hexdigest()
                  if not hmac.compare_digest(actual,fingerprint):raise SystemExit('Signing setting verification failed: '+name)
                  verified+=1
          if not (os.environ['APPLE_TEAM_ID']==os.environ['LEGACY_APP_APPLE_TEAM_ID']==os.environ['LEGACY_CLI_APPLE_TEAM_ID']):
              raise SystemExit('Signing team mismatch; preserve the sources for review')
          print('Verified '+str(verified)+' transferred signing settings and shared signing team; no values exported.')
          PY
