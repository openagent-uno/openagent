[project]
name = "claude-sub-proxy"
version = "0.1.0"
description = "Standalone OpenAI-compatible proxy that bills inference against a Claude Pro/Max subscription by emitting Claude-Code-faithful Anthropic requests. Pipe it into OpenAgent as a `local` model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alessandro Gerelli" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # TLS/JA3 impersonation transport — the whole point. Without it the request
    # is gated at the transport layer and subscription traffic is rejected.
    "curl_cffi>=0.7",
    "httpx>=0.24",
]

[project.optional-dependencies]
# Proactive token-refresh daemon only needs the base deps; listed for parity.
daemon = []

[project.scripts]
claude-sub-proxy = "claude_sub_proxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_sub_proxy"]
