; OpenAgent shared "machine" supervisor config.
; One container runs the network stack (tailscaled+tailscale via containerboot),
; the model backend (claude-sub-proxy), and the OpenAgent runtime together.
; All programs inherit the container environment (TS_*, CLAUDE_SUB_PROXY_*, OPENAGENT_*).
; Lives at /etc/supervisord.conf so bare `supervisorctl status` works (the agent can
; manage its own daemons: e.g. `supervisorctl restart openagent`).
[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- Tailscale (daemon IN the machine): tailscaled, `tailscale up`, applies serve config ---
[program:tailscale]
command=/usr/local/bin/containerboot
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Model backend: Claude subscription via the OpenAI-compatible proxy on :8787 ---
[program:claude-sub-proxy]
command=/usr/local/bin/claude-sub-proxy serve
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- The agent itself (agent dir on the per-agent PVC at /data/agent) ---
[program:openagent]
command=/opt/openagent/bin/openagent -d /data/agent serve
autorestart=true
startsecs=5
startretries=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
