# Example in-cluster doorway for an event source → OpenAgent Events.
#
# An event source (event-worker / event-api, same cluster) POSTs a support thread to
# the agent's webhook listener the moment it lands, instead of the agent
# waiting for its hourly support-coverage cron. The listener is a dedicated
# aiohttp app serving ONLY /hooks/* — the agent's /api/* gateway is not
# registered on this port — and every delivery is HMAC-verified.
#
# Nothing here is reachable from outside the cluster: no Ingress, no Gateway,
# no public hostname. ClusterIP only.
---
apiVersion: v1
kind: Service
metadata:
  name: openagent-primary-hooks
  namespace: default
  labels:
    app: openagent-primary
spec:
  type: ClusterIP
  selector:
    app: openagent-primary
  ports:
    - name: http-hooks
      port: 8899
      targetPort: 8899
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: openagent-secondary-hooks
  namespace: default
  labels:
    app: openagent-secondary
spec:
  type: ClusterIP
  selector:
    app: openagent-secondary
  ports:
    - name: http-hooks
      port: 8899
      targetPort: 8899
      protocol: TCP
---
# openagent-secondary runs under a default-deny ingress policy (openagent-secondary-deny-ingress),
# so the Service above reaches nothing until the event source is let in explicitly — on
# the hooks port and nothing else. event-api is matched by its Knative service
# label, which survives a revision bump; the per-revision `app` label does not.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagent-secondary-allow-event-hooks
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: openagent-secondary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: event-worker
        - podSelector:
            matchLabels:
              serving.knative.dev/service: event-api
      ports:
        - port: 8899
          protocol: TCP
