    HistoryChangedEvent:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              action:
                const: upsert
            required: [action]
          then:
            required: [item]
            properties:
              item:
                $ref: "#/components/schemas/ActivityItem"
        - if:
            properties:
              action:
                const: delete
            required: [action]
          then:
            properties:
              item:
                type: "null"
      required:
        - type
        - revision
        - action
        - activity_id
        - kind
        - resource_id
      properties:
        type:
          type: string
          const: history_changed
        revision:
          $ref: "#/components/schemas/Revision"
        action:
          type: string
          enum:
            - upsert
            - delete
        activity_id:
          $ref: "#/components/schemas/OpaqueId"
          description: Stable ActivityItem.id used as the client-store key.
        kind:
          $ref: "#/components/schemas/ActivityKind"
        resource_id:
          $ref: "#/components/schemas/OpaqueId"
        item:
          anyOf:
            - $ref: "#/components/schemas/ActivityItem"
            - type: "null"
          description: Required for upsert and omitted or null for delete.

    SearchIndexChangedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - index_generation
        - indexed_seq
      properties:
        type:
          type: string
          const: search_index_changed
        index_generation:
          $ref: "#/components/schemas/Revision"
        indexed_seq:
          $ref: "#/components/schemas/Sequence"
